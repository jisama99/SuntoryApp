<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recrutements : carte de France</title>
<style>
:root{--bg:#F4F8FA;--surface:#FFFFFF;--alt:#F0F6F9;--border:#E1EAEF;--text:#16222A;--muted:#5E717C;--p:#00829B;--p-h:#006B80;--p-soft:#E7F5F9;--pk:#E52365;--pk-h:#C81A55;--navy:#08071E;
--ok:#1B7B45;--ok-soft:#E3F5EA;--wa:#8A5A00;--wa-soft:#FFF1D6;--er:#B3202A;--er-soft:#FDE4E6;
--acc:#00829B;--key:#E52365;--map-stroke:#FFFFFF;--hatch1:#E6ECEF;--hatch2:#C9D4DA;
--sh1:0 1px 2px rgba(11,43,58,.06),0 4px 14px rgba(11,43,58,.05);--sh2:0 10px 34px rgba(11,43,58,.18);--r:12px;--rc:16px;--font:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
:root[data-theme="dark"]{--bg:#0C171D;--surface:#13242C;--alt:#1A2F39;--border:#27404C;--text:#E8F0F3;--muted:#A3B6C0;--p:#35B7D1;--p-h:#5BC2DC;--p-soft:#173742;--pk:#FF5C93;--pk-h:#FF7AA8;--navy:#E8F0F3;
--ok:#5CCB8A;--ok-soft:#173826;--wa:#F0B955;--wa-soft:#3A2D12;--er:#FF8088;--er-soft:#3E1B1F;--map-stroke:#0C171D;--hatch1:#1D323C;--hatch2:#2F4958;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 34px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font)}
button,input,select{font-family:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.app-top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.app-top .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;color:var(--navy);white-space:nowrap}
.crumbs-app{color:var(--muted);font-size:13px;white-space:nowrap}
.spacer{flex:1}
.fict{background:var(--wa-soft);color:var(--wa);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.icon-btn{min-height:44px;min-width:44px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-weight:700;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn:hover{border-color:var(--p)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 56px}
h1{font-size:26px;line-height:1.2;margin:0 0 2px;color:var(--navy)}
.sub{margin:0 0 14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border-radius:var(--rc);box-shadow:var(--sh1);padding:10px 16px;border:1px solid var(--border);min-height:74px}
.kpi b{display:block;font-size:24px;line-height:1.15;color:var(--navy)}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.bad b{color:var(--er)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);box-shadow:var(--sh1);padding:8px 10px;margin-bottom:10px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--p)}
.btn.primary{background:var(--pk);border-color:var(--pk);color:#fff}.btn.primary:hover{background:var(--pk-h)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--p-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cnt{background:var(--p);color:#fff;border-radius:999px;min-width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;padding:0 6px}
:root[data-theme="dark"] .cnt{color:#08071E}
.seg{display:inline-flex;background:var(--alt);border-radius:999px;padding:4px}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--p);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#08071E}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
select.sel{min-height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-weight:700}
.grow{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:0 6px;margin:0 0 8px;min-height:0}
.pills button{min-height:44px;background:none;border:0;padding:4px 0}
.pills button span{display:inline-flex;align-items:center;gap:8px;background:var(--p-soft);color:var(--p-h);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pills button span::after{content:"\00d7";font-size:16px;line-height:1}
.pills .clear span{background:transparent;color:var(--muted);text-decoration:underline}.pills .clear span::after{content:""}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.mapbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);box-shadow:var(--sh1);padding:6px 10px 10px;position:relative;display:flex;flex-direction:column}
.geo{display:flex;flex-wrap:wrap;align-items:center;gap:2px 2px;min-height:46px;padding:0 4px}
.geo button{min-height:44px;background:none;border:0;padding:0 8px;font-weight:700;font-size:13px;color:var(--p-h);border-radius:8px}
.geo button:hover{background:var(--alt)}
.geo button[aria-current="true"]{color:var(--text);cursor:default}
.geo .sep{color:var(--muted)}
.frame{position:relative;width:100%;aspect-ratio:620/621;max-height:74vh;margin:0 auto;touch-action:none;flex:1;min-height:0}
.frame svg{width:100%;height:100%;display:block}
.ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.ctl .icon-btn{padding:0;font-size:20px;line-height:1;box-shadow:var(--sh1)}
.dep{fill:var(--f,var(--alt));stroke:var(--st,var(--map-stroke));stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .18s,opacity .18s}
.dep.off{opacity:.38}
.mapbox.some .dep:not(.insel){opacity:.5}
.mapbox.some .dep.off:not(.insel){opacity:.3}
.dep.hov{filter:brightness(.92)}
:root[data-theme="dark"] .dep.hov{filter:brightness(1.25)}
.selo{fill:none;stroke:var(--acc);stroke-width:2.4;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.lbl{fill:var(--text);opacity:.7;font-family:var(--font);font-weight:700;pointer-events:none;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--surface);stroke-width:.12em}
.mk,.st{cursor:pointer}
.mk .ring,.st .ring{fill:none;stroke:var(--key);stroke-width:2.5;vector-effect:non-scaling-stroke;opacity:0}
.mk.sel .ring,.st.sel .ring{opacity:1}
.mk:hover .art{filter:drop-shadow(0 3px 5px rgba(8,7,30,.45))}
.mk .badge{fill:var(--navy)}
:root[data-theme="dark"] .mk .badge{fill:#fff}:root[data-theme="dark"] .mk .badgeT{fill:#08071E}
.mk.late .badge{fill:var(--er)}.mk.late .badgeT{fill:#fff}
.badgeT{fill:#fff;font-weight:700;font-family:var(--font);pointer-events:none}
.st .s0{fill:var(--acc)}.st .s1{fill:var(--surface);stroke:var(--acc)}.st .s2{fill:var(--wa)}.st .s3{fill:var(--key)}
.st .shp{stroke:var(--surface);stroke-width:.22}.st .s1{stroke:var(--acc);stroke-width:.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:8px 6px 2px;align-items:center;min-height:24px}
.legend .lb{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:16px;height:16px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.ramp{width:120px;height:10px;border-radius:999px}
.hatchsw{background:repeating-linear-gradient(45deg,var(--hatch1),var(--hatch1) 3px,var(--hatch2) 3px,var(--hatch2) 5px)}
.empty-ov{position:absolute;inset:60px 20px 40px;display:none;align-items:center;justify-content:center;text-align:center;z-index:2;pointer-events:none}
.empty-ov.on{display:flex}
.empty-ov div{background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh2);border-radius:var(--rc);padding:16px 20px;pointer-events:auto;max-width:320px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);box-shadow:var(--sh1);padding:18px}
.card h2{font-size:18px;margin:0 0 2px;color:var(--navy)}
.card h3{font-size:14px;margin:16px 0 6px;color:var(--navy)}
.zone{color:var(--muted);font-size:13px}
.pill{display:inline-flex;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--alt);margin:2px 4px 2px 0}
.pill.warn{background:var(--wa-soft);color:var(--wa)}.pill.bad{background:var(--er-soft);color:var(--er)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.list{margin-top:8px;display:grid;gap:8px;max-height:360px;overflow:auto}
.list button,.chips button{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-weight:700;text-align:left}
.list button:hover,.chips button:hover{border-color:var(--p)}
.list button small{color:var(--muted);font-weight:500;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:999px;padding:0 14px}
.chips button[aria-pressed="true"]{background:var(--p-soft);border-color:var(--p);color:var(--p-h)}
.steps{display:flex;gap:4px;margin-top:12px}.steps i{flex:1;height:10px;border-radius:999px;background:var(--border)}.steps i.on{background:var(--acc)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:14px}dt{color:var(--muted)}dd{margin:0;font-weight:700}
.tablewrap{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);box-shadow:var(--sh1);padding:4px 14px 12px;overflow-x:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0}
.tools .cap{font-weight:700;color:var(--navy);margin-right:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px}th{color:var(--muted);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:16px}
.empty{color:var(--muted);padding:14px 4px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;max-width:260px;box-shadow:var(--sh2);opacity:0;transition:opacity .1s}
:root[data-theme="dark"] #tip{background:#E8F0F3;color:#08071E}
#tip.on{opacity:1}#tip b{display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
:root[data-theme="dark"] #toast{background:#E8F0F3;color:#08071E}#toast.on{opacity:1}
.scrim{position:fixed;inset:0;background:rgba(8,7,30,.45);z-index:40;display:none}.scrim.open{display:block}
.fp{position:fixed;z-index:41;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);box-shadow:var(--sh2);display:none;flex-direction:column}
.fp.open{display:flex}
.fp header{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}.fp header h2{margin:0;font-size:18px;color:var(--navy)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{min-height:44px;border:0;background:none;font-weight:700;color:var(--muted);padding:0 10px;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--p-h);border-bottom-color:var(--p)}
.fbody{flex:1;overflow:auto;padding:12px 18px}
.search{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--border);padding:0 16px;background:var(--alt);font-size:15px;margin-bottom:8px}
.grp{margin:6px 0 0;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);min-height:44px}
.opt{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 6px 0 22px;border-radius:var(--r);cursor:pointer}
.opt:hover{background:var(--alt)}.grp.opt{padding-left:6px}.opt.sub2{padding-left:40px}
.opt input{width:20px;height:20px;accent-color:var(--p);flex:none}
.opt .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--alt);border-radius:999px;padding:2px 8px}
.opt .code{color:var(--muted);font-size:13px;min-width:26px}
.opt small{color:var(--muted)}
details.sec{margin:8px 0}details.sec>summary{min-height:44px;display:flex;align-items:center;font-weight:800;color:var(--navy);cursor:pointer}
.hintp{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ffoot{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--border)}.ffoot .btn{flex:1;justify-content:center}
.pop{position:absolute;right:16px;top:62px;z-index:45;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:var(--rc);box-shadow:var(--sh2);padding:14px 16px;display:none}
.pop.on{display:block}.pop h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.pop h3:first-child{margin-top:0}
.pal{display:grid;gap:6px}
.pal button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-weight:700;text-align:left}
.pal button[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft)}
.pal button[disabled]{opacity:.55;cursor:not-allowed}
.pal .sw{display:inline-flex;gap:3px}.pal .sw i{width:14px;height:14px;border-radius:4px;display:inline-block}
.mapbox.fs{position:fixed;inset:0;z-index:50;border-radius:0;padding:10px}
.mapbox.fs .frame{max-height:none;aspect-ratio:auto;height:100%}
@media (max-width:980px){.grid{grid-template-columns:1fr}.frame{max-height:none}}
@media (max-width:640px){
  .kpis{gap:8px}.kpi{padding:8px 10px;min-height:68px}.kpi b{font-size:20px}.kpi span{font-size:11px;line-height:1.25;display:block}
  h1{font-size:20px}.sub{font-size:13px;margin-bottom:10px}
  .app-top .in{padding:8px 12px;gap:8px}.crumbs-app,.brand,#dispBtn .dl{display:none}.fict{font-size:11px;padding:4px 8px}.app-top .in{justify-content:flex-end}#dispBtn{padding:0}.spacer{display:none}
  .bar{padding:6px;gap:6px}.btn{padding:0 12px}.seg button{padding:0 9px;font-size:13px}
  .pills{flex-wrap:nowrap;overflow-x:auto}.pills button{flex:none}
  .fp{top:auto;left:0;right:0;width:100%;max-height:90vh;border-radius:22px 22px 0 0}
  #zoomSel{display:none}.pop{right:8px;left:8px;width:auto}
}
@media print{.app-top,.bar,.pills,.ctl,.fp,.scrim,.tools .btn,#side,.pop{display:none!important}.grid{grid-template-columns:1fr}.mapbox,.tablewrap{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
